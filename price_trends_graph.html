<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Trends: Paternoster & Elands Bay (2024-2025)</title>
    <!-- Chart.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.2/chart.umd.min.js"></script>
    <!-- Chart.js Annotation Plugin CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
    <style>
        #priceTrends {
            max-width: 1050px; /* 3.5in at 300 DPI */
            max-height: 750px; /* 2.5in at 300 DPI */
            margin: 0 auto;
            background-color: white; /* Clean white background for PDF */
        }
        body {
            font-family: Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Price Trends: Paternoster & Elands Bay (2024-2025)</h1>
    <canvas id="priceTrends" width="1050" height="750"></canvas>
    <script>
        // Register the annotation plugin
        Chart.register(ChartjsPluginAnnotation);

        // Create the line graph
        const ctx = document.getElementById('priceTrends').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan 2024', 'Jun 2024', 'Dec 2024', 'Jun 2025', 'Dec 2025'],
                datasets: [
                    {
                        label: 'Fixer-Uppers ($)',
                        data: [45000, 47500, 50000, 52500, 55000],
                        borderColor: '#2F4F4F', // Slate Blue
                        backgroundColor: '#2F4F4F',
                        fill: false,
                        tension: 0.3, // Smooth curves
                        pointRadius: 5,
                        pointBackgroundColor: '#2F4F4F'
                    },
                    {
                        label: 'Resales ($)',
                        data: [90000, 95000, 100000, 105000, 110000],
                        borderColor: '#00A86B', // Vibrant Green
                        backgroundColor: '#00A86B',
                        fill: false,
                        tension: 0.3,
                        pointRadius: 5,
                        pointBackgroundColor: '#00A86B'
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Price Trends: Paternoster & Elands Bay (2024-2025)',
                        font: { family: 'Verdana', size: 16, weight: 'bold' },
                        color: '#2F4F4F'
                    },
                    annotation: {
                        annotations: {
                            label1: {
                                type: 'label',
                                xValue: 'Dec 2025',
                                yValue: 110000,
                                content: '10% Growth = High ROI with $VISTA',
                                font: { family: 'Tahoma', size: 12, style: 'italic' },
                                color: '#000',
                                backgroundColor: 'rgba(255, 255, 255, 0.8)',
                                borderRadius: 3,
                                padding: 5
                            }
                        }
                    },
                    legend: {
                        labels: { font: { family: 'Verdana', size: 12 } }
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Months', font: { family: 'Verdana', size: 12 } },
                        grid: { color: 'rgba(0, 0, 0, 0.1)' } // Light gridlines
                    },
                    y: {
                        title: { display: true, text: 'Price (USD)', font: { family: 'Verdana', size: 12 } },
                        beginAtZero: false,
                        min: 40000,
                        max: 120000,
                        ticks: { stepSize: 20000 },
                        grid: { color: 'rgba(0, 0, 0, 0.1)' }
                    }
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Trends: Paternoster & Elands Bay (2024-2025)</title>
    <!-- Chart.js CDN (v4.4.2, reliable for 2025) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.2/chart.umd.min.js"></script>
    <style>
        #priceTrends {
            max-width: 1050px; /* 3.5in at 300 DPI */
            max-height: 750px; /* 2.5in at 300 DPI */
            margin: 0 auto;
            background-color: white; /* Clean white background for PDF */
        }
        body {
            font-family: Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #annotationLabel {
            position: absolute;
            top: 200px; /* Adjust based on graph position; approximate for Dec 2025 point */
            left: 800px; /* Approximate x-position for Dec 2025 */
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 3px;
            font-family: 'Tahoma', sans-serif;
            font-size: 12px;
            font-style: italic;
            color: #000;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1>Price Trends: Paternoster & Elands Bay (2024-2025)</h1>
    <div style="position: relative;">
        <canvas id="priceTrends" width="1050" height="750"></canvas>
        <div id="annotationLabel">10% Growth = High ROI with $VISTA</div>
    </div>
    <script>
        // Error handling: Log if Chart is loaded
        if (typeof Chart === 'undefined') {
            console.error('Chart.js not loaded. Check internet/CDN.');
            document.body.innerHTML += '<p style="color: red;">Error: Chart.js failed to load. Check console (F12).</p>';
        } else {
            console.log('Chart.js loaded successfully.');
        }

        // Create the line graph
        const ctx = document.getElementById('priceTrends').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan 2024', 'Jun 2024', 'Dec 2024', 'Jun 2025', 'Dec 2025'],
                datasets: [
                    {
                        label: 'Fixer-Uppers ($)',
                        data: [45000, 47500, 50000, 52500, 55000],
                        borderColor: '#2F4F4F', // Slate Blue
                        backgroundColor: '#2F4F4F',
                        fill: false,
                        tension: 0.3, // Smooth curves
                        pointRadius: 5,
                        pointBackgroundColor: '#2F4F4F'
                    },
                    {
                        label: 'Resales ($)',
                        data: [90000, 95000, 100000, 105000, 110000],
                        borderColor: '#00A86B', // Vibrant Green
                        backgroundColor: '#00A86B',
                        fill: false,
                        tension: 0.3,
                        pointRadius: 5,
                        pointBackgroundColor: '#00A86B'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Price Trends: Paternoster & Elands Bay (2024-2025)',
                        font: { family: 'Verdana', size: 16, weight: 'bold' },
                        color: '#2F4F4F'
                    },
                    legend: {
                        labels: { font: { family: 'Verdana', size: 12 } }
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Months', font: { family: 'Verdana', size: 12 } },
                        grid: { color: 'rgba(0, 0, 0, 0.1)' } // Light gridlines
                    },
                    y: {
                        title: { display: true, text: 'Price (USD)', font: { family: 'Verdana', size: 12 } },
                        beginAtZero: false,
                        min: 40000,
                        max: 120000,
                        ticks: { stepSize: 20000 },
                        grid: { color: 'rgba(0, 0, 0, 0.1)' }
                    }
                }
            }
        });
        console.log('Graph created successfully.');
    </script>
</body>
</html>
